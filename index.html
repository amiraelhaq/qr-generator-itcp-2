    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #f472b6; /* Pastel Pink */
            --secondary-color: #334155;
            --accent-color: #60a5fa; /* Pastel Blue */
            --tertiary-color: #a78bfa; /* Pastel Purple */
            --background-color: #f5f3ff; /* Very light purple/blue background */
            --surface-color: #ffffff;
            --border-radius: 1.25rem;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--background-color)] text-[var(--secondary-color)] font-sans antialiased;
        }
    }

    @layer components {
        .floating-element {
            @apply absolute pointer-events-none opacity-20 text-2xl animate-bounce;
        }
        .btn {
            @apply px-6 py-2.5 rounded-[var(--border-radius)] font-medium transition-all duration-200 flex items-center justify-center gap-2;
        }
        .btn-primary {
            @apply bg-gradient-to-r from-[var(--primary-color)] via-[var(--tertiary-color)] to-[var(--accent-color)] text-white hover:opacity-90 shadow-lg shadow-purple-200 active:scale-95 border-none;
        }
        .btn-outline {
            @apply border-2 border-purple-100 text-purple-600 hover:bg-purple-50 active:scale-95;
        }
        .card {
            @apply bg-[var(--surface-color)] rounded-[var(--border-radius)] shadow-xl shadow-gray-200/50 border border-gray-100;
        }
        .input-field {
            @apply w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-[var(--primary-color)] focus:ring-2 focus:ring-blue-100 outline-none transition-all;
        }
        .tab-item {
            @apply px-4 py-2 cursor-pointer border-b-2 transition-all font-medium whitespace-nowrap;
        }
        .tab-item.active {
            @apply border-[var(--primary-color)] text-[var(--primary-color)];
        }
        .tab-item.inactive {
            @apply border-transparent text-gray-500 hover:text-gray-700;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/WelcomeScreen.js"></script>
    <script type="text/babel" src="components/ClosingScreen.js"></script>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/QRDisplay.js"></script>
    <script type="text/babel" src="components/ConfigPanel.js"></script>
    <script type="text/babel" src="utils/qrHelper.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
